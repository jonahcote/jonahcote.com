   For each NYC subway station we compute the faster of two gateway routes:

   (A) Via NY Penn Station:
       subway → 34 St-Penn → NJ Transit Northeast Corridor / Midtown Direct
       → Newark Penn → walk to Seton Hall Law
       Overhead: walk to NJT concourse (3) + avg peak wait (8)
                 + NJT ride (20) + walk to SHL (5) = +36 min

   (B) Via WTC PATH:
       subway → WTC / Fulton → PATH Newark-WTC line
       → Newark Penn → walk to Seton Hall Law
       Overhead: walk to PATH (2) + avg wait (5)
                 + PATH ride (22) + walk to SHL (5) = +34 min

   NJ Transit NEC peak headways: ~10-20 min. PATH Newark-WTC: ~4-10 min.
   ========================================================================= */

function commute(s) {
  const viaPenn = s.toPenn + PENN_OVERHEAD;
  const viaWTC  = s.toWTC  + WTC_OVERHEAD;
  return { total: Math.min(viaPenn, viaWTC), viaPenn, viaWTC };
}

function colorFor(mins) {
  if (mins < 40) return '#1a9850';
  if (mins < 50) return '#66bd63';
  if (mins < 55) return '#d9ef8b';
  if (mins < 60) return '#fee08b';
  if (mins < 70) return '#fc8d59';
  return '#d73027';
}

}).addTo(map);

});

}).addTo(map).bindPopup('<b>Newark Penn Station</b><br>PATH Newark-WTC + NJ Transit NEC<br>~5 min walk to Seton Hall Law');

// ---- Transfer gateway markers (highlighted) ----
const gateways = [
  { name: "NY Penn Station (NJ Transit)", lat: 40.7506, lng: -73.9936 },
  { name: "WTC PATH Station",              lat: 40.7126, lng: -74.0099 },
];
gateways.forEach(g => {
  L.circleMarker([g.lat, g.lng], {
    radius: 11, color: '#1a4d8f', weight: 3, fillColor: '#4a90d9', fillOpacity: 0.4
  }).addTo(map).bindTooltip(g.name, { permanent: false, direction: 'top' });
});

// ---- Station markers ----
stations.forEach(s => {
  const c = commute(s);
  const fastest = c.viaWTC <= c.viaPenn ? 'wtc' : 'penn';
  const color = colorFor(c.total);

  const marker = L.circleMarker([s.lat, s.lng], {
    radius: 7,
    color: '#1a1a1a',
    weight: 1,
    fillColor: color,
    fillOpacity: 0.92
  }).addTo(map);

  const pennHtml = `
    <div class="popup-route${fastest==='penn'?' fastest':''}">
      <b>${fastest==='penn'?'✓ ':''}Via NY Penn Station</b><br>
      ${s.toPenn} min subway + 3 walk + 8 wait + 20 NJT + 5 walk
      = <b>${c.viaPenn} min</b>
    </div>`;
  const wtcHtml = `
    <div class="popup-route${fastest==='wtc'?' fastest':''}">
      <b>${fastest==='wtc'?'✓ ':''}Via WTC PATH</b><br>
      ${s.toWTC} min subway + 2 walk + 5 wait + 22 PATH + 5 walk
      = <b>${c.viaWTC} min</b>
    </div>`;

  marker.bindPopup(`
    <div class="popup-title">${s.name}</div>
    <div class="popup-lines">Lines: ${s.lines}</div>
    <div class="popup-time" style="color:${color}">${c.total} min</div>
    ${pennHtml}
    ${wtcHtml}
    <div class="popup-note">Peak-hour estimate. Off-peak adds ~5–10 min for longer waits.</div>
  `, { maxWidth: 280 });

  marker.bindTooltip(`${s.name}: ${c.total} min`, { direction: 'top' });
});

// ---- Methodology box (bottom-right) ----
const methodControl = L.control({ position: 'bottomright' });
methodControl.onAdd = function() {
  const div = L.DomUtil.create('div', 'method-box');
  div.innerHTML = `
    <b>Model</b><br>
    For each station, the faster of two routes wins:<br>
    <b>A.</b> Subway → 34 St-Penn → NJ Transit NEC (~20 min) → Newark Penn<br>
    <b>B.</b> Subway → WTC/Fulton → PATH Newark-WTC (~22 min) → Newark Penn<br>
    Both add ~5 min walk to SHL. Waits based on peak headways (NJT ~8 min, PATH ~5 min).
  `;
  L.DomEvent.disableClickPropagation(div);
  return div;
};
methodControl.addTo(map);

// ---- Fit bounds to include SHL and all stations ----
const bounds = L.latLngBounds([[40.7369, -74.1676]]);
stations.forEach(s => bounds.extend([s.lat, s.lng]));
map.fitBounds(bounds, { padding: [60, 60] });
</script>
